[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailctl"
version = "0.8.0"
description = "Manage MXRoute email filters over ManageSieve and IMAP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "sievelib>=1.5.0,<2",
  "IMAPClient>=4.1,<5",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.16",
  "pytest>=8.0",
  "pyright[nodejs]>=1.1.400",
]

[project.scripts]
mailctl = "mailctl.cli:main"

[tool.setuptools]
packages = ["mailctl"]

[tool.ruff]
line-length = 79

# `target-version` is deliberately not set: ruff infers it from the
# `requires-python` above, so there is one place to bump the floor, not two.

[tool.ruff.lint]
# The E subset is deliberate rather than a bare "E": E2xx is whitespace and
# comment style, which is the formatter's business, and `ruff format` already
# gates it. The separators every module uses -- the thick `# ####` section
# rule and the thin `# ----` function rule (code-style.md) -- are written in
# the spacing the formatter emits, so nothing here is excluded to
# accommodate them.
select = ["E4", "E7", "E9", "E501", "F", "I", "B", "C4", "SIM", "UP", "RUF"]

[tool.pyright]
# The tests are in scope: pytest is a dev dependency, so its imports resolve
# from the same .venv, and a fixture typed wrong is a test checking the
# wrong thing.
include = ["mailctl", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "live: hits a real MXroute account and mutates real state; also gated on MAILCTL_LIVE=1",
]
