# Dovecot 2.4 settings for mailctl's container test tier, shaped after what
# mailctl/providers/mxroute/RECORD.md records of one MXroute server: Maildir++
# with a `.` separator, STARTTLS on 4190 and 143, implicit TLS on 993, and
# the Sieve extensions the probe saw advertised. Where the packaged version
# cannot match, .claude/TESTS.md says so.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap sieve
listen = *
log_path = /dev/stderr

# PLAIN only, as MXroute's ManageSieve SASL list was observed; plaintext
# auth stays refused until TLS is up (the 2.4 default), so a client that
# skipped STARTTLS fails here the way it would against MXroute.
auth_mechanisms = plain
ssl = required
ssl_server_cert_file = /etc/dovecot/tls/tls.crt
ssl_server_key_file = /etc/dovecot/tls/tls.key

# Any user name logs in with the one password, and gets its own empty
# mailbox the first time it does: each test is a new user, with no account
# to register first. A passwd-file with users appended mid-run was tried
# and every other new user's login failed (the reload is not immediate;
# why was not pinned down), so there is no file to reload.
# The password is written by the test fixture before Dovecot starts
# (entrypoint.sh); it is never in the image.
!include /etc/dovecot/secret.conf

passdb static {
}

userdb static {
  # dovecot-lda looks the user up with no password to check it by.
  userdb_static_allow_all_users = yes
}

mail_uid = vmail
mail_gid = vmail
mail_home = /srv/vmail/%{user}
mail_driver = maildir
mail_path = ~/Maildir
mailbox_list_layout = maildir++

# MXroute's personal namespace, as read on 2026-09-28: an empty prefix and
# a `.` separator. INBOX.spam is then a child of INBOX, which is how the
# observed account names its spam folder.
namespace inbox {
  inbox = yes
  separator = .
  prefix =
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# IMAP runs a post-login script, which sends an ALERT to a user named for
# it and nothing to anyone else (postlogin.sh; mailctl #205).
service imap-postlogin {
  executable = script-login /usr/local/bin/postlogin.sh
  user = $SET:default_internal_user
  unix_listener imap-postlogin {
  }
}

service imap {
  executable = imap imap-postlogin
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

# Turned off because the MXroute probe did not see them advertised.
sieve_extensions {
  enotify = no
}

# Local delivery runs the active Sieve script, so a test can hand a new
# message to dovecot-lda and see the rule mailctl uploaded act on it --
# the going-forward half, beside the retroactive IMAP half.
postmaster_address = postmaster@example.test

protocol lda {
  mail_plugins {
    sieve = yes
  }
}
